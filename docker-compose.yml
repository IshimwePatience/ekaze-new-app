version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ekaze-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Patience123@}
      POSTGRES_DB: ${DB_NAME:-ekaze_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ekaze-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ekaze_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ekaze-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - ekaze-network

  backend:
    build:
      context: ./ekaze-backend-node
      dockerfile: Dockerfile
    container_name: ekaze-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./ekaze-backend-node/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: https://ekaze.benofinance.rw
      GOOGLE_CALLBACK_URL: https://ekaze.benofinance.rw/api/v1/auth/google/callback
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5001:5000"
    networks:
      - ekaze-network

  frontend:
    build:
      context: ./ekaze-frontend-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://ekaze.benofinance.rw/api/v1
        VITE_STORAGE_URL: https://ekaze.benofinance.rw
        VITE_GOOGLE_CLIENT_ID: 851412910623-p7ov04uca9tqtg20f3hg17i6upqjvkua.apps.googleusercontent.com
    container_name: ekaze-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - ekaze-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  ekaze-network:
    driver: bridge

